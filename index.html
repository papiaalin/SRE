<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        /* Header Style */
        header {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: red;
            text-align: left;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* Main Section Style */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h2 {
            color: #4f46e5;
            margin-bottom: 12px;
        }

        ul {
            list-style-type: square;
            margin-left: 20px;
        }

        /* Footer Style */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #1e293b;
            color: #94a3b8;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Welcome to My Website</h1>
        <p>A simple responsive web page template</p>
    </header>

    <!-- Main Content -->
    <div class="container">
        
        <div class="card">
            <h2>About Me</h2>
            <p>Welcome! This is a simple HTML</p>
        </div>

        <div class="card">
            <h2>My Services</h2>
            <ul>
                <li>Web Development</li>
                <li>Responsive UI Design</li>
                <li>Software Engineering</li>
            </ul>
        </div>

    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
